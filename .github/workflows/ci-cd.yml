name: Kivorly Multi-Platform CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish official GitHub release?'
        type: boolean
        required: true
        default: false
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        type: string
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-ios:
    name: Build & Package iOS
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          
          echo "Selecting Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Display Xcode Version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project "ios/Kivorly.xcodeproj" \
            -scheme "Kivorly" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create iOS Archive
        run: |
          xcodebuild archive \
            -project "ios/Kivorly.xcodeproj" \
            -scheme "Kivorly" \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Kivorly.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package iOS Build Artifacts
        run: |
          mkdir -p ./release-artifacts
          cd build
          zip -r ../release-artifacts/Kivorly-iOS.xcarchive.zip Kivorly.xcarchive
          if [ -d "Kivorly.xcarchive/Products/Applications" ]; then
            cd Kivorly.xcarchive/Products/Applications
            zip -r ../../../../release-artifacts/Kivorly-iOS.zip *
            cd ../../../..
          fi

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kivorly-iOS
          path: ./release-artifacts/*
          retention-days: 30

  build-android:
    name: Build & Validate Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy Android APK Artifact
        run: |
          mkdir -p ./release-artifacts
          find ./android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} ./release-artifacts/Kivorly-Android-debug.apk \; || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kivorly-Android
          path: ./release-artifacts/Kivorly-Android*.apk
          retention-days: 30

  build-web:
    name: Build & Validate Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Web Dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Production App
        working-directory: ./web
        run: pnpm build

      - name: Package Web Build Artifacts
        run: |
          mkdir -p ./release-artifacts
          cd web
          tar -czf ../release-artifacts/Kivorly-Web-Build.tar.gz .next/standalone .next/static public || tar -czf ../release-artifacts/Kivorly-Web-Build.tar.gz .next public

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kivorly-Web
          path: ./release-artifacts/Kivorly-Web-Build.tar.gz
          retention-days: 30

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-ios, build-android, build-web]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts

      - name: Determine Release Tag and Version
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            TAG="${{ inputs.release_version }}"
          else
            TAG="v1.0.0"
          fi

          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "title=Kivorly ${TAG}" >> $GITHUB_OUTPUT

      - name: Prepare Final Release Assets
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"
          mkdir -p ./final-release

          find ./all-artifacts -name "*Android*.apk" -exec cp {} "./final-release/Kivorly-v${VERSION}-Android.apk" \; || true
          find ./all-artifacts -name "*xcarchive.zip" -exec cp {} "./final-release/Kivorly-v${VERSION}-iOS.xcarchive.zip" \; || true
          find ./all-artifacts -name "*Kivorly-iOS.zip" -exec cp {} "./final-release/Kivorly-v${VERSION}-iOS.zip" \; || true
          find ./all-artifacts -name "*Web*.tar.gz" -exec cp {} "./final-release/Kivorly-v${VERSION}-Web.tar.gz" \; || true

          echo "Final release assets ready:"
          ls -lh ./final-release

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: ./final-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🇧🇩 Kivorly Multi-Platform Release ${{ steps.release_info.outputs.tag }}

            - **Version**: `${{ steps.release_info.outputs.version }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            #### 📦 Included Multi-Platform Assets:
            - **🤖 Android**: `Kivorly-v${{ steps.release_info.outputs.version }}-Android.apk`
            - **🍏 iOS**: `Kivorly-v${{ steps.release_info.outputs.version }}-iOS.zip` & `Kivorly-v${{ steps.release_info.outputs.version }}-iOS.xcarchive.zip`
            - **🌐 Web**: `Kivorly-v${{ steps.release_info.outputs.version }}-Web.tar.gz`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
