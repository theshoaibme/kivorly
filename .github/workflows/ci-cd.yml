name: Kivorly Multi-Platform CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-ios:
    name: Build & Package iOS
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          
          echo "Selecting Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Display Xcode Version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project "ios/Kivorly.xcodeproj" \
            -scheme "Kivorly" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create iOS Archive
        run: |
          xcodebuild archive \
            -project "ios/Kivorly.xcodeproj" \
            -scheme "Kivorly" \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Kivorly.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package iOS Build Artifacts
        run: |
          mkdir -p ./release-artifacts
          cd build
          zip -r ../release-artifacts/Kivorly-iOS.xcarchive.zip Kivorly.xcarchive
          if [ -d "Kivorly.xcarchive/Products/Applications" ]; then
            cd Kivorly.xcarchive/Products/Applications
            zip -r ../../../../release-artifacts/Kivorly-iOS.zip *
            cd ../../../..
          fi

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kivorly-iOS-${{ github.run_number }}
          path: ./release-artifacts/*
          retention-days: 30

  build-android:
    name: Build & Validate Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy Android APK Artifact
        run: |
          mkdir -p ./release-artifacts
          find ./android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} ./release-artifacts/Kivorly-Android-debug.apk \; || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kivorly-Android-${{ github.run_number }}
          path: ./release-artifacts/Kivorly-Android*.apk
          retention-days: 30

  build-web:
    name: Build & Validate Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Web Dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Production App
        working-directory: ./web
        run: pnpm build

      - name: Package Web Build Artifacts
        run: |
          mkdir -p ./release-artifacts
          cd web
          tar -czf ../release-artifacts/Kivorly-Web-Build.tar.gz .next/standalone .next/static public || tar -czf ../release-artifacts/Kivorly-Web-Build.tar.gz .next public

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kivorly-Web-${{ github.run_number }}
          path: ./release-artifacts/Kivorly-Web-Build.tar.gz
          retention-days: 30

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-ios, build-android, build-web]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts

      - name: Prepare Final Release Assets
        run: |
          mkdir -p ./final-release
          find ./all-artifacts -type f -exec cp {} ./final-release/ \;
          ls -lh ./final-release

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "title=Kivorly Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "title=Kivorly Build #${{ github.run_number }} (main)" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.title }}
          files: ./final-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🇧🇩 Kivorly Multi-Platform Super App Release

            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build Number**: `#${{ github.run_number }}`
            
            #### 📦 Included Multi-Platform Assets:
            - **iOS**: `Kivorly-iOS.zip` & `Kivorly-iOS.xcarchive.zip` (Native SwiftUI App)
            - **Android**: `Kivorly-Android-debug.apk` (Native Kotlin & Jetpack Compose)
            - **Web**: `Kivorly-Web-Build.tar.gz` (Next.js 16 + React 19)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
