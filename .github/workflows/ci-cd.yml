name: Kivorly CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Kivorly App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          
          # Find the latest Xcode 16 installation
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          
          echo "Selecting Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Display Xcode Version
        run: xcodebuild -version

      - name: Build App for iOS Simulator
        run: |
          xcodebuild build \
            -project "Untitled Project.xcodeproj" \
            -scheme "MyApp" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create iOS App Archive
        run: |
          xcodebuild archive \
            -project "Untitled Project.xcodeproj" \
            -scheme "MyApp" \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Kivorly.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Build Artifacts
        run: |
          mkdir -p ./release-artifacts
          # Zip the full xcarchive
          cd build
          zip -r ../release-artifacts/Kivorly.xcarchive.zip Kivorly.xcarchive
          # Zip the compiled .app bundle if available in Products
          if [ -d "Kivorly.xcarchive/Products/Applications" ]; then
            cd Kivorly.xcarchive/Products/Applications
            zip -r ../../../../release-artifacts/Kivorly-App.zip *
            cd ../../../..
          fi

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Kivorly-iOS-Build-${{ github.run_number }}
          path: ./release-artifacts/*
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "title=Kivorly Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "title=Kivorly Build #${{ github.run_number }} (main)" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.title }}
          files: ./release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🇧🇩 Kivorly Super App - Automated Build & Release

            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build Number**: `#${{ github.run_number }}`
            
            #### Included Assets:
            - `Kivorly.xcarchive.zip`: Full Xcode Archive for distribution & code signing.
            - `Kivorly-App.zip`: Compiled Application Bundle.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
