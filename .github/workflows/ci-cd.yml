name: Kivorly CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build App for iOS Simulator
        run: |
          xcodebuild build \
            -project "Untitled Project.xcodeproj" \
            -scheme "MyApp" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  release-build:
    name: Build Archive & Publish Release
    runs-on: macos-14
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Archive App
        run: |
          xcodebuild archive \
            -project "Untitled Project.xcodeproj" \
            -scheme "MyApp" \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Kivorly.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Zip Archive Artifact
        run: |
          cd build
          zip -r Kivorly.xcarchive.zip Kivorly.xcarchive

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivorly-iOS-Build
          path: ./build/Kivorly.xcarchive.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/Kivorly.xcarchive.zip
          name: Kivorly Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
